name: Bug report
description: Something in the simulator, the story game or the dashboard doesn't work
labels: [bug]
body:
  - type: dropdown
    id: page
    attributes:
      label: Which page?
      options:
        - Simulator (index.html)
        - Story game (play.html)
        - Dashboard (dashboard.html)
        - Docs
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open the story game
        2. Talk to Lola Cora
        3. ...
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: Browser and computer
      placeholder: Chrome 130 on Windows 11, integrated graphics
  - type: textarea
    id: console
    attributes:
      label: Console errors
      description: Open the browser's developer tools (F12) and paste anything red.
      render: shell
