name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - run: npm run build
      - name: Keep the build for inspection
        if: matrix.node == 22
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          retention-days: 7

  firmware-logic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: The node's alert logic agrees with the simulator on every shared case
        run: |
          g++ -std=c++11 -Wall -I firmware/bantay-baha-node firmware/test/logic_test.cpp -o logic_test
          ./logic_test

  docker:
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - name: The image the README describes still builds
        run: docker build -t bantay-baha .
